# 마이프랜 어드민 — nginx 가상 호스트
# 위치: /etc/nginx/sites-available/myfran-admin
# 활성: ln -sf /etc/nginx/sites-available/myfran-admin /etc/nginx/sites-enabled/
#
# 어드민은 별도 서브도메인(admin.마이프랜.com) 또는
# IP:3002 직접 접근으로 운영 가능. 서브도메인 사용 시 아래 설정 사용.

server {
    listen 80;
    listen [::]:80;
    server_name admin.xn--lj2b54b90v2gn.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.xn--lj2b54b90v2gn.com;

    ssl_certificate     /etc/letsencrypt/live/admin.xn--lj2b54b90v2gn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xn--lj2b54b90v2gn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 어드민 → PM2 (포트 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /home/ubuntu/myfran/data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    client_max_body_size 20m;
}
