# 마이프랜 프론트엔드 — nginx 가상 호스트
# 위치: /etc/nginx/sites-available/myfran-web
# 활성: ln -sf /etc/nginx/sites-available/myfran-web /etc/nginx/sites-enabled/

# ── HTTP → HTTPS 리다이렉트 ──
server {
    listen 80;
    listen [::]:80;
    server_name xn--lj2b54b90v2gn.com;  # 마이프랜.com 퓨니코드

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (SSL 인증서 발급 후 활성화) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--lj2b54b90v2gn.com;

    # Let's Encrypt 인증서 (certbot 발급 후 경로 확인)
    ssl_certificate     /etc/letsencrypt/live/xn--lj2b54b90v2gn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--lj2b54b90v2gn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js standalone → PM2 (포트 3003)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
    }

    # 정적 파일 캐시 (Next.js _next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 업로드 이미지 (어드민에서 올린 파일)
    location /uploads/ {
        alias /home/ubuntu/myfran/data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    client_max_body_size 20m;
}
