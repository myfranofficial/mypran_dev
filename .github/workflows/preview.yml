name: Preview (home-test)

# home-test 브랜치 전용 미리보기 배포.
# 실제 사이트(main, 포트 3003)와 완전히 분리된 폴더·포트(3004)에서 실행됩니다.
# 접속: http://<서버 IP>:3004/home-test

on:
  push:
    branches: [home-test]
  workflow_dispatch:

concurrency:
  group: preview-home-test
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy preview via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e

            BRANCH=home-test
            PREVIEW=/home/ubuntu/myfran/preview
            REPO=$PREVIEW/repo
            APP=$PREVIEW/web
            PORT=3004

            echo "=== 1. 브랜치 받기 (실제 사이트 저장소와 별도 폴더) ==="
            mkdir -p $PREVIEW
            if [ ! -d $REPO/.git ]; then
              git clone --branch $BRANCH --single-branch https://github.com/myfranofficial/mypran_dev.git $REPO
            fi
            cd $REPO
            git fetch origin $BRANCH
            git checkout -B $BRANCH origin/$BRANCH
            git reset --hard origin/$BRANCH
            git clean -fd

            echo "=== 2. 빌드 ==="
            cd $REPO/web
            # 관리자에서 올린 이미지가 미리보기에서도 보이도록 연결 (빌드 전에 있어야 함)
            if [ -d /home/ubuntu/myfran/data/uploads ] && [ ! -e public/uploads ]; then
              ln -s /home/ubuntu/myfran/data/uploads public/uploads
            fi
            npm install
            npx next build --webpack

            echo "=== 3. 미리보기 폴더에 배치 ==="
            rm -rf $APP
            cp -r .next/standalone $APP
            cp -r public $APP/public 2>/dev/null || true
            cp -r .next/static $APP/.next/static
            # 실제 사이트 데이터의 '복사본'을 사용 (실제 데이터는 건드리지 않음)
            rm -rf $APP/data
            cp -r /home/ubuntu/myfran/web/current/data $APP/data

            echo "=== 4. 미리보기 실행 (포트 $PORT) ==="
            pm2 delete myfran-preview 2>/dev/null || true
            cd $APP
            NODE_ENV=production PORT=$PORT HOSTNAME=0.0.0.0 \
              pm2 start server.js --name myfran-preview \
              --max-memory-restart 300M

            echo "=== 5. 확인 ==="
            CODE=000
            for i in $(seq 1 20); do
              sleep 3
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "http://127.0.0.1:$PORT/home-test" || true)
              echo "시도 $i: /home-test → $CODE"
              [ "$CODE" = "200" ] && break
            done
            if [ "$CODE" != "200" ]; then
              pm2 logs myfran-preview --lines 40 --nostream || true
              exit 1
            fi
            echo "미리보기 주소: http://<서버 IP>:$PORT/home-test"
