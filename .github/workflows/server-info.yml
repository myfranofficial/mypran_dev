name: Server info (read-only)

# 읽기 전용 점검: 서버 종류, 서버 내부 방화벽 상태, 외부에서 3004 포트 접속 가능 여부.
# 서버 설정은 아무것도 바꾸지 않습니다.

on:
  push:
    branches: [home-test]
    paths: [".github/workflows/server-info.yml"]

jobs:
  inside:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "== vendor"; cat /sys/class/dmi/id/sys_vendor 2>/dev/null; cat /sys/class/dmi/id/product_name 2>/dev/null
            echo "== hostname"; hostname
            TOKEN=$(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
            echo "== aws region"; curl -s -m 2 -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region || true; echo
            echo "== aws instance type"; curl -s -m 2 -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-type || true; echo
            echo "== ufw"; sudo -n ufw status 2>&1 | head -20 || true
            echo "== listening"; ss -ltn | grep -E ":(80|443|3002|3003|3004) " || true
            echo "== nginx sites-enabled"; ls -la /etc/nginx/sites-enabled/
            for f in /etc/nginx/sites-enabled/*; do echo "----- $f"; sudo -n cat "$f"; done
            echo "== nginx -t"; sudo -n nginx -t 2>&1 || true

  outside:
    runs-on: ubuntu-latest
    steps:
      - name: Check site and preview from outside
        run: |
          D=https://xn--lj2b54b90v2gn.kr
          for u in / /brands /preview/home-test /preview; do
            echo "$u → $(curl -s -o /dev/null -w '%{http_code}' -L --max-redirs 0 $D$u)"
          done
          curl -s $D/preview/home-test -o page.html
          echo "title: $(grep -o '<title>[^<]*' page.html | head -1)"
          echo "robots: $(grep -o '<meta name="robots"[^>]*' page.html | head -1)"
          echo "header: $(curl -sI $D/preview/home-test | grep -i x-robots-tag)"
          CSS=$(grep -o '/preview/_next/static/[^"]*\.css' page.html | head -1)
          echo "css $CSS → $(curl -s -o /dev/null -w '%{http_code}' $D$CSS)"
          JS=$(grep -o '/preview/_next/static/[^"]*\.js' page.html | head -1)
          echo "js → $(curl -s -o /dev/null -w '%{http_code}' $D$JS)"
